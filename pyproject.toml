[project]
name = "mitopipeline"
version = "0.2.0"
description = "Automated mitochondrial genome assembly, annotation, and reporting pipeline."
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "pyarrow",
    "openpyxl",
    "biopython",
    "matplotlib",
    "pytest",
    "pyyaml",
    "snakemake",
    # Reads back a real compiled report PDF's own text layer in
    # tests/unit/13-report_pdf/test_pdf_export.py's escaping
    # round-trip regression test -- never used at pipeline runtime.
    "pymupdf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that run external tools, conda, or Snakemake",
]
addopts = "-m 'not slow'"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]